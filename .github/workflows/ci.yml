name: HSE V3 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Lint Python files
        run: |
          python3 -m py_compile custom_components/hse/__init__.py
          python3 -m py_compile custom_components/hse/api/views/costs.py
          python3 -m py_compile custom_components/hse/api/views/overview.py
          python3 -m py_compile custom_components/hse/api/views/settings.py
          python3 -m py_compile custom_components/hse/engine/period_stats.py
          python3 -m py_compile custom_components/hse/engine/analytics.py
          python3 -m py_compile custom_components/hse/time_utils.py
          python3 -m py_compile custom_components/hse/storage/manager.py
          python3 -m py_compile custom_components/hse/api/base.py

      - name: Run unit tests
        run: |
          python3 -m unittest discover -s tests -v

      - name: Check no forbidden imports in engine modules
        run: |
          if grep -rn "import homeassistant" custom_components/hse/engine/ | grep -v "from homeassistant.core import HomeAssistant"; then
            echo "ERREUR: import homeassistant interdit dans engine/ (sauf HomeAssistant)"
            exit 1
          fi
